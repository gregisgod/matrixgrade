let currentCards = [];
let currentIndex = 0;
let showingQuestion = true;
function loadSubjects() {
const lvl = document.getElementById("levelSelect").value;
const subDropdown = document.getElementById("subjectSelect");
subDropdown.innerHTML = '-- Select Subject --';
document.getElementById("unitSelect").innerHTML = '-- Select Unit Section --';
if (lvl && database[lvl]) {
Object.keys(database[lvl]).forEach(sub => {
subDropdown.innerHTML += <option value="${sub}">${sub}</option>;
});
}
}
function loadUnits() {
const lvl = document.getElementById("levelSelect").value;
const sub = document.getElementById("subjectSelect").value;
const unitDropdown = document.getElementById("unitSelect");
unitDropdown.innerHTML = '-- Select Unit Section --';
if (lvl && sub && database[lvl][sub]) {
if (Array.isArray(database[lvl][sub])) {
unitDropdown.innerHTML += <option value="all">Core Syllabus</option>;
} else {
Object.keys(database[lvl][sub]).forEach(unit => {
unitDropdown.innerHTML += <option value="${unit}">${unit}</option>;
});
}
}
}
function startDeck() {
const lvl = document.getElementById("levelSelect").value;
const sub = document.getElementById("subjectSelect").value;
const unit = document.getElementById("unitSelect").value;
if (lvl && sub && unit) {
if (unit === "all") {
currentCards = database[lvl][sub];
} else {
currentCards = database[lvl][sub][unit];
}
currentIndex = 0;
showingQuestion = true;
updateCardDisplay();
}
}
function updateCardDisplay() {
const card = document.getElementById("flashcard");
if (!currentCards || currentCards.length === 0) {
card.innerText = "This unit slot is prepped for database expansion.";
return;
}
if (showingQuestion) {
card.innerText = currentCards[currentIndex].q;
card.style.color = "#e0e1dd";
} else {
card.innerText = currentCards[currentIndex].a;
card.style.color = "#778da9";
}
}
function flipCard() {
if (!currentCards || currentCards.length === 0) return;
showingQuestion = !showingQuestion;
updateCardDisplay();
const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
document.getElementById("quoteDisplay").innerText = randomQuote;
}
function nextCard() {
if (!currentCards || currentCards.length === 0) return;
currentIndex = (currentIndex + 1) % currentCards.length;
showingQuestion = true;
updateCardDisplay();
}
function previousCard() {
if (!currentCards || currentCards.length === 0) return;
currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
showingQuestion = true;
updateCardDisplay();
}
